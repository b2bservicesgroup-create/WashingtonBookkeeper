[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# ── One address per page ──────────────────────────────────────────────
# Send www and plain-http variants to the main https://washingtonbookkeeper.com address.
[[redirects]]
  from = "https://www.washingtonbookkeeper.com/*"
  to = "https://washingtonbookkeeper.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "http://www.washingtonbookkeeper.com/*"
  to = "https://washingtonbookkeeper.com/:splat"
  status = 301
  force = true

# Trailing slashes (/pricing/ -> /pricing) are handled by the edge function in
# netlify/edge-functions/trailing-slash.ts, because Netlify redirect rules
# treat /pricing and /pricing/ as the same path and would loop.

# ── New client intake ─────────────────────────────────────────────────
# Short address for the Zoho Creator bookkeeping intake form.
[[redirects]]
  from = "/start"
  to = "https://creatorapp.zohopublic.com/b2bservicesgroup663/bookkeeping-onboarding/form-perma/New_Bookkeeping_Client/avDFw7Ya2YafstYHZTGBxUbWjCM1Fhg52bbu7W48yU09ezb3fSJwCFAfR5OnBdbvSRv5Rb55GCm7vXOp6Jf5NzWGKF92UgkBnZPC"
  status = 302
  force = true
